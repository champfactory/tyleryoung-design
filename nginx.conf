server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Without these, nginx builds its trailing-slash redirect from the socket it
  # is listening on and answers /alucify with
  #   Location: http://host:8080/alucify/
  # which leaks the internal port and drops TLS. Every page but the homepage is
  # reached through that redirect, so it breaks the whole site behind a proxy.
  # Relative Locations let the edge keep its own scheme and port.
  absolute_redirect off;
  port_in_redirect off;

  # Astro builds with format: 'directory', so /alucify is /alucify/index.html.
  # Without the $uri/index.html fallback every page but the homepage 404s.
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  error_page 404 /404.html;

  # Hashed assets are immutable; HTML is not, so it revalidates. Getting this
  # backwards is how a deploy appears to have done nothing.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(png|jpg|jpeg|svg|webp|woff2)$ {
    add_header Cache-Control "public, max-age=604800";
  }

  location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
